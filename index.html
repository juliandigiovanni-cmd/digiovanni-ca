<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>di Giovanni</title>
<meta name="description" content="Websites of George, Julian and Adrian di Giovanni.">
<style>
  :root { --bg: #fdfcf9; --fg: #222; --muted: #777; --link: #1f4e79; --rule: #ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e8e6e1; --muted: #999; --link: #8fb8e0; --rule: #333; }
  }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
  }
  main { padding: 2rem 1rem; text-align: center; }
  h1 { font-weight: normal; font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0; border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  a { display: block; padding: 0.9rem 2rem; font-size: 1.5rem; color: var(--link); text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>di Giovanni</h1>
  <ul>
    <li><a href="https://george.digiovanni.ca/">George di Giovanni</a></li>
    <li><a href="https://julian.digiovanni.ca/">Julian di Giovanni</a></li>
    <li><a href="https://adrian.digiovanni.ca/">Adrian Di Giovanni</a></li>
  </ul>
</main>
</body>
</html>
